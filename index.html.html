<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>🎈 Ballon-Jagd</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#173451}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:linear-gradient(#86cfff,#dff7ff);touch-action:manipulation}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:17px;padding:12px 22px;font-weight:800;background:#fff;color:#20527b;box-shadow:0 5px 0 #0002}button:active{transform:translateY(2px)}button.primary{background:#30bd71;color:white;font-size:clamp(22px,3vw,36px);padding:17px 55px}#sky{position:fixed;inset:0;overflow:hidden}.cloud{position:absolute;width:170px;height:55px;background:#ffffffa8;border-radius:70px;filter:blur(1px);pointer-events:none}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:85px;height:85px;left:26px;bottom:9px}.cloud:after{width:100px;height:70px;left:75px;bottom:4px}.cloud:nth-child(1){left:8%;top:17%}.cloud:nth-child(2){right:11%;top:28%;transform:scale(.8)}.cloud:nth-child(3){left:42%;bottom:15%;transform:scale(1.2)}#hud{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:clamp(28px,4vw,50px);font-variant-numeric:tabular-nums;font-weight:900;background:#ffffffcf;border-radius:20px;padding:8px 28px;box-shadow:0 7px 25px #21507824;z-index:3;display:none;white-space:nowrap}#balloon{position:absolute;width:3cm;height:3cm;border-radius:50%;display:none;z-index:2;transform:translate(-50%,-50%);touch-action:none;cursor:pointer;box-shadow:inset -13px -16px 22px #0004, inset 10px 12px 18px #fff5,0 12px 15px #163c6024;animation:sway 1.6s ease-in-out infinite alternate}#balloon:before{content:"";position:absolute;width:30%;height:20%;top:16%;left:19%;border-radius:50%;background:#fff9;filter:blur(5px);transform:rotate(-32deg)}@keyframes sway{from{translate:-5px -3px}to{translate:5px 3px}}.piece{position:absolute;width:12px;height:10px;pointer-events:none;z-index:5;border-radius:3px;animation:burst .35s ease-out forwards}@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}.panel{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);background:#ffffffed;border:2px solid #fff;border-radius:30px;box-shadow:0 15px 65px #17416a35;padding:clamp(16px,3vw,30px);width:min(620px,90vw);max-height:92dvh;overflow:auto;text-align:center}.panel h1{font-size:clamp(30px,5vw,54px);margin:0 0 10px}.panel h2{font-size:clamp(25px,3vw,38px);margin:0 0 12px}.panel p{margin:9px 0 15px}.panel button{margin:6px}.hidden{display:none!important}table{width:100%;border-collapse:collapse;text-align:left;font-variant-numeric:tabular-nums}th,td{padding:7px 10px;border-bottom:1px solid #dceaf2}th:last-child,td:last-child{text-align:right}#scores{max-height:28vh;overflow:auto;margin-top:12px}#allScores{max-height:46vh;overflow:auto}input{border:2px solid #8ac6e8;border-radius:14px;padding:12px;width:min(300px,90%);font-size:22px;text-align:center}#record{font-weight:800;color:#167344}#tip{font-size:13px;color:#547188;margin-top:10px}#turnHint{position:absolute;right:16px;bottom:12px;opacity:.35;font-size:14px;display:none}@media(max-height:520px){.panel{padding:12px 22px}.panel h1{font-size:30px}.panel h2{font-size:27px}#scores{max-height:23vh}th,td{padding:4px 8px}.panel p{margin:4px 0 8px}}
</style></head><body><div id="sky"><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div><div id="hud">00:00,00</div><div id="balloon" role="button" aria-label="Ballon platzen lassen"></div><div id="turnHint"></div></div>
<section class="panel" id="home"><h1>🎈 Ballon-Jagd</h1><p>10 Ballons, 10 Treffer. Wer ist am schnellsten?</p><button class="primary" id="start">▶ START</button><h2 style="font-size:23px;margin-top:16px">🏆 Die besten Zeiten</h2><div id="scores"></div><button id="showAll">Alle Ergebnisse</button><p id="tip">Für das beste Erlebnis: iPad quer halten und die Seite zum Home-Bildschirm hinzufügen.</p></section>
<section class="panel hidden" id="finish"><h2>🎉 Geschafft!</h2><p style="font-size:clamp(25px,4vw,43px);font-weight:900" id="finalTime"></p><p id="record"></p><label for="player">Dein Name:</label><br><input id="player" maxlength="30" autocomplete="off" placeholder="Name eingeben"><br><button class="primary" id="save">🏆 Ergebnis speichern</button><button id="skip">Ohne Speichern weiter</button></section>
<section class="panel hidden" id="listPanel"><h2>🏆 Alle Ergebnisse</h2><div id="allScores"></div><button id="export">⬇ Ergebnisse sichern</button><button id="import">⬆ Ergebnisse laden</button><input type="file" id="fileInput" accept="application/json,.json" hidden><br><button id="back">← Zurück</button></section>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),panels=['home','finish','listPanel'];const colors=['#17171b','#48205f','#bb8bdf','#163aaf','#79c8ff','#a50d2c','#fa6b81','#ff941e','#ffe042','#36bf5a'];const key='ballonjagd_scores_v1';let scores=[],index=0,started=0,elapsed=0,active=false,animating=false,audio=null,raf=0;const balloon=$('balloon');function load(){try{const v=JSON.parse(localStorage.getItem(key)||'[]');scores=Array.isArray(v)?v.filter(x=>typeof x.name==='string'&&Number.isFinite(x.time)&&x.time>=0).slice(0,20000):[]}catch{scores=[]}}function persist(){try{localStorage.setItem(key,JSON.stringify(scores));return true}catch{return false}}function fmt(ms){let c=Math.floor(ms/10),sec=Math.floor(c/100),min=Math.floor(sec/60);return String(min).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')+','+String(c%100).padStart(2,'0')}function sorted(){return [...scores].sort((a,b)=>a.time-b.time)}function escape(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function table(items){return items.length?'<table><thead><tr><th>Platz</th><th>Name</th><th>Zeit</th></tr></thead><tbody>'+items.map((s,i)=>`<tr><td>${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td><td>${escape(s.name)}</td><td>${fmt(s.time)}</td></tr>`).join('')+'</tbody></table>':'<p>Noch keine Ergebnisse. Starte die erste Runde!</p>'}function render(){const a=sorted();$('scores').innerHTML=table(a.slice(0,10));$('allScores').innerHTML=table(a)}function show(id){panels.forEach(p=>$(p).classList.toggle('hidden',p!==id))}function clock(){if(!active)return;$('hud').textContent=fmt(performance.now()-started);raf=requestAnimationFrame(clock)}function place(){const w=balloon.offsetWidth||113,h=balloon.offsetHeight||113;const pad=Math.max(76,2/2.54*96);const safeTop=Math.max(pad,($('hud').getBoundingClientRect().bottom+20+h/2));const xmin=pad+w/2,xmax=innerWidth-pad-w/2,ymin=safeTop,ymax=innerHeight-pad-h/2;const x=xmax>xmin?xmin+Math.random()*(xmax-xmin):innerWidth/2;const y=ymax>ymin?ymin+Math.random()*(ymax-ymin):innerHeight*.65;balloon.style.left=x+'px';balloon.style.top=y+'px';balloon.style.backgroundColor=colors[index];balloon.style.display='block';animating=false}function sound(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(240,t);o.frequency.exponentialRampToValueAtTime(85,t+.085);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.23,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+.1);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.11)}catch{}}function burst(){const r=balloon.getBoundingClientRect();for(let i=0;i<15;i++){const p=document.createElement('div'),a=Math.random()*Math.PI*2,d=30+Math.random()*95;p.className='piece';p.style.left=(r.left+r.width/2)+'px';p.style.top=(r.top+r.height/2)+'px';p.style.background=colors[index];p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');p.style.setProperty('--rot',(Math.random()*600-300)+'deg');$('sky').appendChild(p);setTimeout(()=>p.remove(),400)}}function hit(e){e.preventDefault();if(!active||animating)return;animating=true;sound();burst();balloon.style.display='none';if(index===9){elapsed=performance.now()-started;active=false;cancelAnimationFrame(raf);$('hud').textContent=fmt(elapsed);setTimeout(end,350)}else{index++;setTimeout(()=>{if(active)place()},300)}}function start(){index=0;elapsed=0;active=true;animating=false;show('none');$('hud').style.display='block';$('hud').textContent='00:00,00';started=performance.now();place();cancelAnimationFrame(raf);clock()}function end(){$('hud').style.display='none';$('finalTime').textContent=fmt(elapsed);$('record').textContent='';$('player').value='';show('finish');}function save(){const name=$('player').value.trim();if(!name){$('player').focus();return}const old=scores.filter(s=>s.name.toLocaleLowerCase('de')===name.toLocaleLowerCase('de')).map(s=>s.time);const best=old.length?Math.min(...old):null;scores.push({name,time:elapsed,date:new Date().toISOString()});const ok=persist();render();if(best!==null&&elapsed<best){alert('🏆 Neuer persönlicher Rekord! '+fmt(best-elapsed)+' schneller!')}else if(best===null){alert('🎉 Erster Eintrag für '+name+'!')}if(!ok)alert('Hinweis: Der Browser konnte die Ergebnisse nicht dauerhaft speichern.');show('home')}function exportScores(){const blob=new Blob([JSON.stringify({app:'Ballon-Jagd',version:1,scores},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Ballon-Jagd-Highscores.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function importScores(file){try{const obj=JSON.parse(await file.text()),arr=Array.isArray(obj)?obj:obj.scores;if(!Array.isArray(arr))throw Error();const valid=arr.filter(x=>x&&typeof x.name==='string'&&x.name.trim()&&x.name.length<=30&&typeof x.time==='number'&&Number.isFinite(x.time)&&x.time>=0&&x.time<36000000).map(x=>({name:x.name.trim(),time:x.time,date:typeof x.date==='string'?x.date:''}));if(!confirm(valid.length+' Ergebnisse importieren? Vorhandene Ergebnisse bleiben erhalten.'))return;scores.push(...valid);persist();render();alert('Ergebnisse importiert!')}catch{alert('Die Datei konnte nicht gelesen werden.')}}balloon.addEventListener('pointerdown',hit);$('start').onclick=start;$('save').onclick=save;$('skip').onclick=()=>show('home');$('showAll').onclick=()=>{render();show('listPanel')};$('back').onclick=()=>show('home');$('export').onclick=exportScores;$('import').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{if(e.target.files[0])importScores(e.target.files[0]);e.target.value=''};$('player').addEventListener('keydown',e=>{if(e.key==='Enter')save()});load();render();})();
</script></body></html>
